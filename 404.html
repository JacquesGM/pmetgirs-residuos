<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>O PMetGIRS mudou de endereço</title>

    <!--
      Este endereço é legado. O portal oficial do PMetGIRS passou a ser servido
      pelo Firebase Hosting em 15/08/2026.

      O GitHub Pages é estático e não emite redirecionamento HTTP 301, então o
      melhor disponível é a combinação abaixo:
        - <link rel="canonical"> para consolidar a indexação no endereço novo;
        - <meta refresh> para quem está sem JavaScript;
        - script que preserva o caminho, para que /projetos caia em /projetos e
          não na home;
        - um link visível, para o caso de tudo acima falhar.

      Nenhum robots.txt bloqueia esta pasta de propósito: um crawler impedido de
      entrar aqui nunca veria o redirecionamento, e o endereço antigo ficaria
      indexado para sempre.
    -->
    <link rel="canonical" href="https://teste-e003c.web.app/" />
    <meta name="robots" content="noindex, follow" />
    <meta http-equiv="refresh" content="0; url=https://teste-e003c.web.app/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <script>
      (function () {
        var DESTINO = 'https://teste-e003c.web.app';
        // O primeiro segmento é o nome do repositório (/pmetgirs-residuos) e
        // não existe no destino, que fica na raiz do domínio.
        var partes = window.location.pathname.split('/').filter(Boolean);
        var caminho = partes.slice(1).join('/');
        window.location.replace(
          DESTINO + '/' + caminho + window.location.search + window.location.hash
        );
      })();
    </script>

    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: #f7f8f9;
        color: #181a1e;
      }
      main { max-width: 34rem; text-align: center; }
      h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
      p { margin: 0 0 1.5rem; color: #3a3f47; line-height: 1.6; }
      a {
        display: inline-block;
        padding: 0.75rem 1.25rem;
        border-radius: 0.375rem;
        background: #173f68;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible { outline: 3px solid #2a6ca8; outline-offset: 2px; }
      @media (prefers-color-scheme: dark) {
        body { background: #181a1e; color: #f7f8f9; }
        p { color: #b7bec7; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>O PMetGIRS mudou de endereço</h1>
      <p>
        Este endereço não é mais o oficial. Você está sendo levado ao portal novo;
        se nada acontecer, use o link abaixo.
      </p>
      <a href="https://teste-e003c.web.app/">Ir para o portal do PMetGIRS</a>
    </main>
  </body>
</html>
