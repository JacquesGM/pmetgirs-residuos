name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Só leitura. Nenhum job aqui escreve no repositório, e o padrão da conta pode
# ser permissivo — declarar o mínimo evita que um passo comprometido consiga
# empurrar commit ou publicar release.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      # O emulador do Firestore roda sobre a JVM. O firebase-tools 15 exige
      # JDK 21 ou superior e recusa versões anteriores com erro explícito —
      # não é preferência, é requisito do runtime.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Alinha a versão do npm com a usada para gerar o package-lock.json
      # localmente (npm 10, do Node 20 da imagem do runner, resolve
      # dependências opcionais do esbuild de forma diferente do npm 11 e
      # rejeita o lock como "fora de sincronia" — não é o lock que está
      # errado, é a versão do npm).
      - run: npm install -g npm@11

      - run: npm ci

      - name: Checagem de tipos (tsc)
        run: npx tsc -b

      - name: Testes (vitest)
        run: npm run test -- --run

      # Sobe o emulador, roda a matriz de papéis e derruba o emulador.
      # Inclui os casos de escalada de privilégio: se a fronteira de governança
      # for afrouxada, o CI barra antes do merge.
      - name: Testes das Security Rules (Emulator)
        run: npm run test:rules

      # O que vai no bundle do cidadão não pode ter vulnerabilidade conhecida.
      # A cadeia de desenvolvimento (firebase-tools, vite, jsdom) fica de fora
      # de propósito: ela não é servida a ninguém, e falhar o CI por causa dela
      # treinaria o time a ignorar o passo.
      - name: Auditoria das dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Build de produção
        run: npm run build

      # Confere que o snapshot versionado corresponde à projeção publicada.
      # Pega os dois descuidos que ninguém nota: publicar sem regerar o
      # snapshot, e editar um arquivo de dados à mão.
      #
      # Sem secret: a leitura de publicWorkspaces responde 200 sem chave
      # alguma — quem autoriza é a Security Rule `allow read: if true`. O ID do
      # projeto não é segredo e já aparece no bundle público.
      #
      # Falha apenas quando há divergência de verdade. Se a projeção não puder
      # ser lida — rede fora, projeto indisponível —, o passo informa que a
      # verificação foi inconclusiva e passa: um CI que fica vermelho por
      # motivo alheio ao commit ensina o time a ignorá-lo.
      - name: Conferir o snapshot público
        env:
          FIREBASE_PROJECT_ID: teste-e003c
        run: npm run snapshot -- --check

      - name: Relatório de tamanho do bundle
        run: |
          echo "### Bundle" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -h dist/assets/*.js | sort -h >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- deploy
  #
  # DESLIGADO POR PADRÃO. Só roda quando a variável de repositório
  # DEPLOY_ENABLED valer "true". O provisionamento (Workload Identity
  # Federation, conta de serviço, secrets) está no guia interno de deploy do
  # Instituto Rio Metrópole — a documentação de infraestrutura não fica neste
  # repositório de propósito.
  #
  # O interruptor é uma variável, e não a mera presença dos secrets, por dois
  # motivos. O primeiro é técnico: o contexto `secrets` não existe em `if` de
  # job, então "pular se não houver secret" não é expressável — a primeira
  # versão deste job usava só `github.ref` e teria FALHADO o CI em todo push
  # para main enquanto o provisionamento não existisse. O segundo é de
  # governança: ligar publicação automática de um portal público deve ser um
  # ato deliberado e registrado, não uma consequência de alguém ter criado um
  # secret.
  #
  # Duas decisões que valem explicação:
  #
  # 1. O build é REFEITO aqui, e não reaproveitado de build-and-test. Aquele
  #    build roda sem as variáveis VITE_FIREBASE_*, de propósito: PR de fork não
  #    recebe secret. O bundle que ele produz compila mas tem a configuração
  #    vazia, e publicá-lo entregaria a área de gestão morta. O build daqui é o
  #    único com a configuração real.
  #
  # 2. Autenticação por Workload Identity Federation, sem chave de conta de
  #    serviço. Chave de conta de serviço é credencial de vida longa: vaza uma
  #    vez e vale até alguém revogar. A regra deste projeto é ADC, e WIF é a
  #    forma dela no GitHub Actions.
  deploy:
    needs: [build-and-test, secrets-scan]
    if: >-
      vars.DEPLOY_ENABLED == 'true'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Exige aprovação manual se o ambiente estiver configurado com revisor no
    # GitHub. É um portal público de transparência: a automação leva o commit
    # até a porta, quem abre a porta é uma pessoa.
    environment: production
    defaults:
      run:
        working-directory: app
    permissions:
      contents: read
      # Necessária para o GitHub emitir o token OIDC que o WIF troca por
      # credencial do Google. É a única permissão a mais que o deploy pede.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm install -g npm@11
      - run: npm ci

      - name: Build de produção com a configuração real
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
        run: npm run build

      # Confere o ARTEFATO, não a tubulação de variáveis.
      #
      # Um secret com nome errado, ou não configurado, produz um bundle que
      # compila e sobe — e só quebra quando alguém tenta entrar. Procurar o ID
      # do projeto dentro do JavaScript gerado prova que a configuração chegou
      # ao arquivo que vai ao ar. O ID não é segredo: já aparece no bundle
      # público, é o que esta verificação constata.
      - name: Provar que a configuração entrou no bundle
        env:
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::VITE_FIREBASE_PROJECT_ID não configurado. Ver o guia interno de deploy."
            exit 1
          fi
          if ! grep -rqF "$PROJECT_ID" dist/assets/*.js; then
            echo "::error::O bundle não contém a configuração do Firebase."
            echo "A área de gestão subiria morta: readConfig() lança em tempo de execução."
            exit 1
          fi
          echo "Configuração presente no bundle."

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      # Regras junto com o hosting, e não em separado, porque as duas coisas
      # mudam juntas: uma coleção nova precisa da tela E da regra no mesmo
      # release. Publicar só uma delas foi o que derrubou duas telas em
      # 16/08/2026. Os 51 testes de Rules já rodaram em build-and-test.
      - name: Deploy (hosting + regras)
        run: |
          npx firebase deploy \
            --only hosting,firestore:rules \
            --project "${{ secrets.VITE_FIREBASE_PROJECT_ID }}" \
            --non-interactive

      # O deploy pode "concluir" e servir uma versão anterior por cache ou por
      # release não finalizado. Buscar a página prova que o servidor responde.
      - name: Conferir que o site responde
        run: |
          URL="https://${{ secrets.VITE_FIREBASE_PROJECT_ID }}.web.app/"
          CODIGO=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$URL")
          if [ "$CODIGO" != "200" ]; then
            echo "::error::$URL respondeu $CODIGO depois do deploy."
            exit 1
          fi
          echo "$URL respondeu 200."

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Rede de segurança contra o erro mais caro possível: commitar uma chave.
      # Procura por padrões de credencial nos arquivos versionados.
      #
      # Exclusões e o motivo de cada uma:
      #   .env.example — só contém nomes de variável, sem valores;
      #   README       — explica o que NÃO commitar e cita os padrões;
      #   este arquivo — define os padrões e casaria consigo mesmo.
      - name: Procurar credenciais nos arquivos versionados
        run: |
          set +e
          PADROES='BEGIN [A-Z ]*PRIVATE KEY|"private_key"|"type": *"service_account"|AIza[0-9A-Za-z_-]{35}'
          ACHADOS=$(git ls-files -z \
            | grep -zZv -E '\.env\.example$|^README\.md$|^\.github/workflows/ci\.yml$' \
            | xargs -0 grep -InE "$PADROES" 2>/dev/null)
          if [ -n "$ACHADOS" ]; then
            echo "::error::Possível credencial em arquivo versionado:"
            echo "$ACHADOS"
            exit 1
          fi
          echo "Nenhuma credencial encontrada nos arquivos versionados."

      - name: Confirmar que nenhum .env real está versionado
        run: |
          set +e
          ENVS=$(git ls-files | grep -E '(^|/)\.env' | grep -v '\.env\.example$')
          if [ -n "$ENVS" ]; then
            echo "::error::Arquivo .env versionado: $ENVS"
            exit 1
          fi
          echo "Nenhum .env versionado."
